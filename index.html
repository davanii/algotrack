<script>
// ========================================================================
// CONFIGURATION CARTE (API, couleurs, helpers, mock → common.js)
// ========================================================================
const MAP_CFG = {
  MAP_CENTER: [-23.38, 43.69],
  MAP_ZOOM: 12,
  MAP_BOUNDS_PADDING: [60, 60],
  ZOOM_SITE: 14,
  TILE_URL: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  TILE_LABELS: "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
  TILE_ATTR: "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics"
};

const SELECTORS = {
  map: "#map", sidebar: "#sidebar", sidebarOverlay: "#sidebarOverlay",
  sidebarBody: "#sbBody", sidebarTitle: "#sbTitle", sidebarTehake: "#sbTehakeSecteur",
  sidebarTche: "#sbTche", sidebarBadge: "#sbSgrBadge", sidebarSgrLabel: "#sbSgrLabel",
  sidebarVarBadges: "#sbVarBadges", sidebarZoneFilter: "#sbZoneFilter",
  closeSidebarBtn: "#closeSidebar",
  searchInput: "#searchInput", searchResults: "#searchResults",
  sgrFilter: "#sgrFilter",
  statusBadge: "#statusBadge", statusDot: "#statusDot", statusText: "#statusText"
};

// ========================================================================
// ETAT GLOBAL
// ========================================================================
const STATE = {
  map: null, markersLayerGroup: null, markers: {},
  sitesData: {}, geoJsonPoints: null, hasInitialFit: false,
  searchItems: [], searchActive: 0,
  panelZone: null, currentSiteId: null
};

// ========================================================================
// DONNÉES
// ========================================================================
function ingest(geo) {
  STATE.geoJsonPoints = geo;
  STATE.sitesData = {};
  geo.features.forEach(f => {
    const p = f.properties;
    p.sgrMoyen = computeSgrMoyen(p.rows || []);
    STATE.sitesData[p.site_id] = p;
  });
}

// SGR moyen 
function computeSgrMoyen(rows) {
  const byLine = {};
  rows.forEach(r => (byLine[r.ligne_test] = byLine[r.ligne_test] || []).push(r));
  const lasts = [];
  Object.values(byLine).forEach(rs => {
    const sorted = rs.slice().sort((a, b) =>
      (parseFrDate(a.date_pesage)?.getTime() || 0) - (parseFrDate(b.date_pesage)?.getTime() || 0));
    for (let i = sorted.length - 1; i >= 0; i--) {
      const v = parseTxcr(sorted[i].txcr_calc);
      if (v !== null) { lasts.push(v); break; }
    }
  });
  if (!lasts.length) return null;
  return lasts.reduce((a, b) => a + b, 0) / lasts.length;
}

// ========================================================================
// STEPPER DE CYCLE — dynamique : étapes générées depuis les données (P0…Pn, PR)
// ========================================================================
function cycleStepperHtml(stepper) {
  if (!stepper || !stepper.reached.length) return "";
  const nums = stepper.reached.filter(s => typeof s === "number").sort((a, b) => a - b);
  const hasPR = stepper.reached.includes("PR");
  const stages = [...nums];
  if (hasPR) stages.push("PR");
  if (!stages.length) return "";
  const pill = st => {
    const label = st === "PR" ? "PR" : "P" + st;
    const reached = stepper.reached.includes(st);
    const current = stepper.current === st;
    const cls = "cycle-step " + (current ? "current" : reached ? "reached" : "future");
    return `<span class="${cls}">${label}</span>`;
  };
  return `<div class="cycle-stepper">` +
    stages.map((s, i) => (i ? `<span class="cycle-link">—</span>` : "") + pill(s)).join("") +
    `</div>`;
}

// Une seule RANGÉE par ligne : la DERNIÈRE pesée (remplacée dynamiquement)
function buildLineTables(rows) {
  const byLine = rows.reduce((acc, row) => {
    (acc[row.ligne_test] = acc[row.ligne_test] || []).push(row);
    return acc;
  }, {});

  return Object.keys(byLine)
    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
    .map(lineName => {
      const sorted = byLine[lineName].slice().sort((a, b) =>
        (parseFrDate(a.date_pesage)?.getTime() || 0) - (parseFrDate(b.date_pesage)?.getTime() || 0));

      const last = sorted[sorted.length - 1];
      const prev = sorted.length > 1 ? sorted[sorted.length - 2] : null;
      const p0 = sorted[0];
      const nb = last.nb != null ? parseInt(last.nb, 10) : null;
      const prevNb = prev && prev.nb != null ? parseInt(prev.nb, 10) : null;

      const reached = [];
      sorted.forEach(r => {
        const lab = String(r.pesage || "").trim().toUpperCase();
        const mNum = lab.match(/^P(\d+)/);
        if (mNum) { const st = +mNum[1]; if (!reached.includes(st)) reached.push(st); }
        else if (lab.startsWith("PR") && !reached.includes("PR")) reached.push("PR");
      });
      const lastLab = String(last.pesage || "").trim().toUpperCase();
      const lastNum = lastLab.match(/^P(\d+)/);
      const current = lastNum ? +lastNum[1] : (lastLab.startsWith("PR") ? "PR" : null);

      return {
        lineName,

        // Affichage : libellé sans "(Zone)" — la clé de regroupement reste lineName
        lineDisplay: cleanLigneLabel(lineName, (last.zone || "").trim()),
        planteLe: p0 ? p0.date_pesage : null,
        zone: (last.zone || "").trim(),
        stepper: { reached, current },
        pesees: [{
          pesage: last.pesage, date: last.date_pesage,
          depuisP0: last.duree ? `${last.duree} j` : "—",
          boutures: (nb != null && !isNaN(nb)) ? String(nb) : "—",
          perte: prevNb != null && nb != null && !isNaN(nb) && nb < prevNb,
          sgr: last.txcr_calc
        }]
      };
    });
}

// ========================================================================
// COULEURS
// ========================================================================
function getColorForSgr(value) { return colorFor(value); }
function getColorClassForSgr(value) {
  if (parseTxcr(value) === null) return "text-slate-400";
  return `${getColorForSgr(parseTxcr(value)).text} font-semibold`;
}

// ========================================================================
// CARTE
// ========================================================================
function initMap() {
  STATE.map = L.map(document.querySelector(SELECTORS.map), { zoomControl: false })
    .setView(MAP_CFG.MAP_CENTER, MAP_CFG.MAP_ZOOM);

  L.tileLayer(MAP_CFG.TILE_URL, { attribution: MAP_CFG.TILE_ATTR, maxZoom: 19 }).addTo(STATE.map);
  // Couche labels (villages, frontières) par-dessus l'imagerie satellite
  L.tileLayer(MAP_CFG.TILE_LABELS, { attribution: "", maxZoom: 19, opacity: 0.9 }).addTo(STATE.map);

  L.control.zoom({ position: "topright" }).addTo(STATE.map);
  // Clustering : évite le chevauchement quand le nombre de sites augmente
  STATE.markersLayerGroup = L.markerClusterGroup({
    showCoverageOnHover: false, maxClusterRadius: 45, disableClusteringAtZoom: 13
  }).addTo(STATE.map);
}

function renderMarkers(sitesToShow) {
  STATE.markersLayerGroup.clearLayers();
  STATE.markers = {};
  if (!STATE.geoJsonPoints) return;
  const bounds = [];

  STATE.geoJsonPoints.features.forEach(feature => {
    const siteId = feature.properties.site_id;
    const site = STATE.sitesData[siteId];
    if (!site) return;
    if (sitesToShow && !sitesToShow.has(siteId)) return;

    const [lng, lat] = feature.geometry.coordinates;
    const color = getColorForSgr(site.sgrMoyen);

    const icon = L.divIcon({
      className: "",
      html: `<div class="site-marker" style="width:38px;height:38px;background-color:${color.hex};color:${color.txt}">${esc(siteId)}</div>`,
      iconSize: [38, 38],
      iconAnchor: [19, 19]
    });

    const marker = L.marker([lat, lng], { icon });
    marker.on("click", () => openSidebar(siteId));
    STATE.markersLayerGroup.addLayer(marker);
    STATE.markers[siteId] = marker;
    bounds.push([lat, lng]);
  });

  if (bounds.length > 0 && !STATE.hasInitialFit) {
    STATE.map.fitBounds(bounds, { padding: MAP_CFG.MAP_BOUNDS_PADDING });
    STATE.hasInitialFit = true;
  }
}

// ========================================================================
// SIDEBAR — filtre par zone 
// ========================================================================
function openSidebar(siteId) {
  const site = STATE.sitesData[siteId];
  if (!site) return;
  STATE.currentSiteId = siteId;
  STATE.panelZone = null;

  const $title = document.querySelector(SELECTORS.sidebarTitle);
  const $tehake = document.querySelector(SELECTORS.sidebarTehake);
  const $tche = document.querySelector(SELECTORS.sidebarTche);
  const $sidebar = document.querySelector(SELECTORS.sidebar);
  const $overlay = document.querySelector(SELECTORS.sidebarOverlay);

  if ($title) $title.textContent = `${site.code_site} — ${site.site_nom}`;
  if ($tehake) $tehake.textContent = `Tehake : ${site.tehake || "—"} | Secteur : ${site.secteur || "—"}`;
  if ($tche) $tche.textContent = `Technicien (TCHE) : ${site.tche || "—"}`;

  renderPanelZoneFilter(site);
  renderPanelLines(site);

  $sidebar?.classList.remove("translate-x-full");
  $overlay?.classList.remove("hidden");
}

function panelZonesOf(site) {
  const zones = new Set();
  site.rows.forEach(r => { const z = (r.zone || "").trim(); if (z) zones.add(z); });
  return [...zones].sort();
}

function renderPanelZoneFilter(site) {
  const $zf = document.querySelector(SELECTORS.sidebarZoneFilter);
  if (!$zf) return;
  const zones = panelZonesOf(site);
  if (zones.length < 2) { $zf.innerHTML = ""; return; }
  $zf.innerHTML = `
    <label class="inline-flex items-center gap-1.5 text-[11px] text-slate-500">
      Zone de culture
      <select id="panelZoneSelect" class="bg-slate-50 border border-slate-300 rounded-lg py-1 px-2 text-xs text-slate-900">
        <option value="all">Toutes</option>
        ${zones.map(z => `<option value="${esc(z)}" ${STATE.panelZone === z ? "selected" : ""}>${esc(z)}</option>`).join("")}
      </select>
    </label>`;
  $zf.querySelector("#panelZoneSelect").addEventListener("change", e => {
    STATE.panelZone = e.target.value === "all" ? null : e.target.value;
    renderPanelLines(site);
  });
}

function renderPanelLines(site) {
  const $badge = document.querySelector(SELECTORS.sidebarBadge);
  const $sgrLabel = document.querySelector(SELECTORS.sidebarSgrLabel);
  const $varBadges = document.querySelector(SELECTORS.sidebarVarBadges);
  const $body = document.querySelector(SELECTORS.sidebarBody);
  if (!$body) return;
  $body.innerHTML = "";

  const rows = STATE.panelZone
    ? site.rows.filter(r => (r.zone || "").trim() === STATE.panelZone)
    : site.rows;

  const sgrP = computeSgrMoyen(rows);
  if ($badge) {
    const color = getColorForSgr(sgrP);
    $badge.textContent = sgrP === null ? "En attente" : `${sgrP > 0 ? "+" : ""}${sgrP.toFixed(2)} %/j`;
    $badge.className = `text-sm font-bold px-2.5 py-1 rounded-full ${color.tw} ${color.txt === "#ffffff" ? "text-white" : "text-slate-900"}`;
    if ($sgrLabel) $sgrLabel.textContent = STATE.panelZone ? `SGR moyen — ${STATE.panelZone}` : "SGR moyen du site";
  }

  if ($varBadges) {
    const byVar = {};
    rows.forEach(r => {
      const v = varBase(r.variete) || "—";
      (byVar[v] = byVar[v] || []).push(r);
    });
    $varBadges.innerHTML = Object.entries(byVar).map(([v, rs]) => {
      const m = computeSgrMoyen(rs);
      const c = getColorForSgr(m);
      return `<span class="text-xs font-bold px-3 py-1 rounded-full ${c.tw} ${c.txt === "#ffffff" ? "text-white" : "text-slate-900"}" title="SGR moyen — ${esc(v)}">${esc(v)} <span class="ml-1">${m === null ? "*" : (m > 0 ? "+" : "") + m.toFixed(2)}</span></span>`;
    }).join("");
  }

  const lineTables = buildLineTables(rows);
  if (!lineTables.length) {
    $body.innerHTML = `<p class="text-sm text-slate-500 italic">Aucune ligne dans cette zone de culture.</p>`;
    return;
  }

  lineTables.forEach(lt => {
    const card = document.createElement("div");
    card.className = "bg-slate-50 border border-slate-200 rounded-xl p-4";

    const rowsHtml = lt.pesees.map(pe => `
        <tr class="border-t border-slate-200">
          <td class="py-2 pr-2 text-slate-700 text-xs font-semibold">${esc(pe.pesage)}</td>
          <td class="py-2 pr-2 text-slate-500 text-xs">${esc(displayFr(pe.date))}</td>
          <td class="py-2 pr-2 text-slate-500 text-xs">${esc(pe.depuisP0)}</td>
          <td class="py-2 pr-2 text-xs ${pe.perte ? "text-amber-600" : "text-slate-500"}">${esc(pe.boutures)}${pe.perte ? " ↓" : ""}</td>
          <td class="py-2 text-xs ${getColorClassForSgr(pe.sgr)}">${pe.sgr === "*" ? "—" : esc(pe.sgr)}</td>
        </tr>`).join("");

    card.innerHTML = `
      <h3 class="text-cyan-600 font-semibold text-sm mb-0.5 tracking-wide">${esc(lt.lineDisplay || lt.lineName)}${lt.zone ? `<span class="ml-1.5 align-middle text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-100 border border-slate-200 text-slate-500">${esc(lt.zone)}</span>` : ""}</h3>
      ${lt.planteLe ? `<p class="text-[11px] text-slate-400 mb-1">Planté le ${esc(displayFr(lt.planteLe))}</p>` : `<p class="mb-1"></p>`}
      ${cycleStepperHtml(lt.stepper)}
      <table class="interval-table text-left mt-2">
        <colgroup><col style="width:16%"><col style="width:28%"><col style="width:18%"><col style="width:16%"><col style="width:22%"></colgroup>
        <thead>
          <tr class="text-[10px] uppercase text-slate-500 tracking-wide">
            <th class="pb-1.5 font-medium">Pesée</th>
            <th class="pb-1.5 font-medium">Date</th>
            <th class="pb-1.5 font-medium">P0</th>
            <th class="pb-1.5 font-medium">Bout.</th>
            <th class="pb-1.5 font-medium">SGR</th>
          </tr>
        </thead>
        <tbody>${rowsHtml}</tbody>
      </table>`;
    $body.appendChild(card);
  });
}

function closeSidebar() {
  document.querySelector(SELECTORS.sidebar)?.classList.add("translate-x-full");
  document.querySelector(SELECTORS.sidebarOverlay)?.classList.add("hidden");
}

document.querySelector(SELECTORS.closeSidebarBtn)?.addEventListener("click", closeSidebar);
document.querySelector(SELECTORS.sidebarOverlay)?.addEventListener("click", closeSidebar);

// ========================================================================
// RECHERCHE 
// ========================================================================
function buildSuggestions(query) {
  const q = normFr(query).trim();
  if (!q) return [];
  const all = Object.values(STATE.sitesData);

  const siteMatches = all
    .filter(s => normFr(`${s.code_site} ${s.site_nom} ${s.tche || ""}`).includes(q))
    .sort((a, b) => a.code_site.localeCompare(b.code_site))
    .slice(0, 8)
    .map(s => ({
      type: "site", siteId: s.code_site,
      label: `${s.code_site} — ${s.site_nom}`,
      sub: `Secteur ${s.secteur || "—"}${s.tche ? " · " + s.tche : ""}`
    }));

  const bySec = {};
  all.forEach(s => (bySec[s.secteur || "—"] = (bySec[s.secteur || "—"] || 0) + 1));
  const secMatches = Object.keys(bySec)
    .filter(sec => normFr(sec).includes(q))
    .sort()
    .map(sec => ({ type: "secteur", secteur: sec, label: `Secteur ${sec}`, sub: `${bySec[sec]} site(s)` }));

  return [...siteMatches, ...secMatches].slice(0, 10);
}

function renderResults(items) {
  const $r = document.querySelector(SELECTORS.searchResults);
  STATE.searchItems = items;
  STATE.searchActive = 0;
  if (!items.length) {
    $r.innerHTML = `<p class="px-3 py-2.5 text-xs text-slate-400 italic">Aucun résultat</p>`;
  } else {
    $r.innerHTML = items.map((it, i) => `
      <button type="button" data-idx="${i}"
        class="search-item w-full text-left px-3 py-2 flex items-center gap-2.5 hover:bg-emerald-50 transition ${i === 0 ? "bg-emerald-50/60" : ""}">
        <span class="shrink-0">${it.type === "site" ? "📍" : "🗺️"}</span>
        <span class="flex-1 min-w-0">
          <span class="block text-xs font-semibold text-slate-800 truncate">${esc(it.label)}</span>
          <span class="block text-[10px] text-slate-400 truncate">${esc(it.sub)}</span>
        </span>
      </button>`).join("");
  }
  $r.classList.remove("hidden");
}

function hideResults() {
  document.querySelector(SELECTORS.searchResults)?.classList.add("hidden");
}

function highlightResults() {
  document.querySelectorAll("#searchResults .search-item").forEach((el, i) => {
    el.classList.toggle("bg-emerald-50", i === STATE.searchActive);
  });
  document.querySelectorAll("#searchResults .search-item")[STATE.searchActive]
    ?.scrollIntoView({ block: "nearest" });
}

function chooseItem(it) {
  hideResults();
  document.querySelector(SELECTORS.searchInput).value = "";
  if (!it) return;
  if (it.type === "site") zoomToSite(it.siteId);
  else zoomToSecteur(it.secteur);
}

function zoomToSite(siteId) {
  const f = STATE.geoJsonPoints.features.find(x => x.properties.site_id === siteId);
  if (!f) return;
  const [lng, lat] = f.geometry.coordinates;
  STATE.map.setView([lat, lng], Math.max(STATE.map.getZoom(), MAP_CFG.ZOOM_SITE));
  openSidebar(siteId);
}

function zoomToSecteur(sec) {
  const pts = [];
  STATE.geoJsonPoints.features.forEach(f => {
    if ((f.properties.secteur || "—") === sec) pts.push(f.geometry.coordinates);
  });
  if (!pts.length) return;
  STATE.map.fitBounds(L.latLngBounds(pts.map(c => [c[1], c[0]])), { padding: MAP_CFG.MAP_BOUNDS_PADDING, maxZoom: MAP_CFG.ZOOM_SITE });
}

(function initSearch() {
  const $input = document.querySelector(SELECTORS.searchInput);
  const $results = document.querySelector(SELECTORS.searchResults);
  if (!$input || !$results) return;

  $input.addEventListener("input", () => {
    const q = $input.value.trim();
    if (!q) { hideResults(); return; }
    renderResults(buildSuggestions(q));
  });

  $input.addEventListener("keydown", e => {
    if ($results.classList.contains("hidden")) return;
    const items = STATE.searchItems || [];
    if (!items.length) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      STATE.searchActive = (STATE.searchActive + (e.key === "ArrowDown" ? 1 : items.length - 1)) % items.length;
      highlightResults();
    } else if (e.key === "Enter") {
      e.preventDefault();
      chooseItem(items[STATE.searchActive] || items[0]);
    } else if (e.key === "Escape") {
      hideResults();
    }
  });

  $results.addEventListener("click", e => {
    const btn = e.target.closest(".search-item");
    if (!btn) return;
    chooseItem(STATE.searchItems[+btn.dataset.idx]);
  });

  document.addEventListener("click", e => {
    if (!e.target.closest("#searchWrap")) hideResults();
  });
})();

// ========================================================================
// FILTRE SGR
// ========================================================================
function applyFilters() {
  const sgrFilterVal = document.querySelector(SELECTORS.sgrFilter)?.value || "all";
  const visible = new Set();

  Object.values(STATE.sitesData).forEach(site => {
    let matches = true;
    const sgr = site.sgrMoyen;
    if (sgrFilterVal === "positive" && !(sgr !== null && sgr > 0)) matches = false;
    if (sgrFilterVal === "negative" && !(sgr !== null && sgr < 0)) matches = false;
    if (matches) visible.add(site.code_site);
  });

  renderMarkers(visible);
}

document.querySelector(SELECTORS.sgrFilter)?.addEventListener("change", applyFilters);

// ========================================================================
// BOOTSTRAP + RAFRAÎCHISSEMENT AUTO
// ========================================================================
async function bootstrap() {
  initMap();
  ingest(await loadData(false));
  renderMarkers(null);
  applyFilters();
}

bootstrap();

setInterval(async () => {
  if (!CONFIG.API_URL.includes("script.google.com")) return;
  try {
    ingest(await loadData(true));
    applyFilters();
  } catch (e) { console.warn("Rafraîchissement échoué :", e.message); }
}, CONFIG.REFRESH_MS);
</script>
</body>
</html>
